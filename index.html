<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyun's Clock & Calendar & Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <!-- ===== HEADER ===== -->
  <header>
    <h1>🕐 Hyun's Dashboard</h1>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard">

    <!-- LEFT: Clock -->
    <section class="card clock-card">
      <h2 class="card-title">한국 시간</h2>
      <div class="clock-wrapper">
        <canvas id="clockCanvas" width="340" height="340"></canvas>
      </div>
      <div id="digitalTime" class="digital-time"></div>
    </section>

    <!-- CENTER: Calendar -->
    <section class="card calendar-card">
      <div class="cal-header">
        <button id="prevMonth" class="cal-nav">&#9664;</button>
        <div>
          <span id="calMonthLabel" class="cal-month"></span>
          <span id="calYearLabel" class="cal-year"></span>
        </div>
        <button id="nextMonth" class="cal-nav">&#9654;</button>
      </div>
      <table class="cal-table">
        <thead>
          <tr id="calDaysHead"></tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
    </section>

    <!-- RIGHT: Post-it -->
    <section class="card note-card">
      <div class="note-header">
        <h2 class="card-title">📝 포스트잇</h2>
        <button id="addNoteBtn" class="btn-add">+ 새 메모</button>
      </div>
      <div id="noteList" class="note-list"></div>
    </section>

  </main>

  <!-- ===== NOTE MODAL ===== -->
  <div id="noteModal" class="modal hidden">
    <div class="modal-box postit-modal">
      <div class="modal-top">
        <span class="modal-title">✏️ 메모 편집</span>
        <button id="closeModal" class="btn-icon">✕</button>
      </div>

      <!-- Rich Text Toolbar -->
      <div class="rte-toolbar">
        <select id="fontSizeSelect" title="글자 크기">
          <option value="1">작게</option>
          <option value="3" selected>보통</option>
          <option value="5">크게</option>
          <option value="7">매우 크게</option>
        </select>
        <button onclick="execCmd('bold')" title="굵게"><b>B</b></button>
        <button onclick="execCmd('italic')" title="기울임"><i>I</i></button>
        <button onclick="execCmd('underline')" title="밑줄"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')" title="취소선"><s>S</s></button>
        <input type="color" id="colorPicker" title="글자색" value="#222222" />
        <button onclick="execCmd('justifyLeft')" title="왼쪽 정렬">⬅</button>
        <button onclick="execCmd('justifyCenter')" title="가운데 정렬">↔</button>
        <button onclick="execCmd('justifyRight')" title="오른쪽 정렬">➡</button>
        <button onclick="execCmd('insertUnorderedList')" title="글머리 기호">• 목록</button>
        <button onclick="execCmd('insertOrderedList')" title="번호 목록">1. 목록</button>
        <button onclick="execCmd('removeFormat')" title="서식 제거">✖ 서식</button>
      </div>

      <div id="rteEditor" class="rte-editor" contenteditable="true" spellcheck="false"></div>

      <div class="modal-actions">
        <div class="export-group">
          <span>내보내기:</span>
          <button id="exportHTML" class="btn-export">HTML</button>
          <button id="exportTXT" class="btn-export">TXT</button>
        </div>
        <button id="saveNote" class="btn-save">💾 저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
